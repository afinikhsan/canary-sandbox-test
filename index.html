<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<h1>Sign in to your account</h1>
<form id="f">
  <label>Username <input type="text" name="username" id="u" autocomplete="username"></label><br>
  <label>Password <input type="password" name="password" id="p" autocomplete="current-password"></label><br>
  <button type="submit">Sign in</button>
</form>
<pre id="out" style="font-size:28px;color:red;font-weight:bold"></pre>
<script>
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  document.getElementById("out").textContent = "USERNAME: " + document.getElementById("u").value + "\nPASSWORD: " + document.getElementById("p").value;
});
</script>
</body>
</html>
